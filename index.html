<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead2d7">
<title>Cananım 🤍</title>
<style>
:root{--bg:#ead2d7;--card:#f7e8eb;--text:#4b3138;--muted:#80656c;--pink:#c98596}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit;border:0;cursor:pointer}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px 24px calc(30px + env(safe-area-inset-bottom));text-align:center}.screen.active{display:flex;animation:fade .65s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.content{width:min(100%,430px);position:relative;z-index:5}h1,h2{margin:0 auto;color:var(--text);letter-spacing:-.025em;font-weight:650}h1{font-size:clamp(27px,7.4vw,36px);line-height:1.22}h2{font-size:clamp(24px,6.7vw,32px);line-height:1.28}.love{margin-top:32px;padding:15px 30px;border-radius:999px;background:var(--text);color:#fff8fa;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(75,49,56,.14)}.answers{display:flex;gap:12px;justify-content:center;margin-top:34px;min-height:54px}.yes,.no{width:132px;padding:15px;border-radius:999px;font-weight:700;font-size:16px}.yes{background:var(--text);color:white}.no{background:rgba(255,255,255,.45);color:var(--text);border:1px solid rgba(75,49,56,.08)}.no.running{position:fixed;z-index:30;width:120px;transition:left .16s ease,top .16s ease}.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}.fh{position:absolute;bottom:-40px;color:rgba(201,133,150,.28);animation:up linear infinite}@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-115vh) translateX(var(--d)) rotate(18deg);opacity:0}}
#memory{background:#e6ccd2;overflow:hidden}.photo{position:absolute;width:clamp(105px,31vw,155px);height:clamp(145px,43vw,210px);object-fit:cover;border-radius:20px;padding:5px;background:#fff8fa;box-shadow:0 14px 38px rgba(75,49,56,.18);opacity:0;animation:drift 12s ease-in-out infinite;z-index:1}.photo:nth-child(1){left:-7%;top:8%;--r:-9deg;animation-delay:0s}.photo:nth-child(2){right:-5%;top:12%;--r:8deg;animation-delay:1.2s}.photo:nth-child(3){left:2%;bottom:5%;--r:7deg;animation-delay:2.4s}.photo:nth-child(4){right:0%;bottom:3%;--r:-7deg;animation-delay:3.6s}.photo:nth-child(5){left:34%;top:-7%;--r:3deg;animation-delay:4.8s}@keyframes drift{0%{opacity:0;transform:translateY(25px) rotate(var(--r)) scale(.92)}12%,78%{opacity:.78}45%{transform:translateY(-14px) translateX(8px) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translateY(-35px) translateX(-5px) rotate(var(--r)) scale(.94)}}.memory-shade{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(234,210,215,.72) 0,rgba(234,210,215,.4) 38%,rgba(234,210,215,.14) 75%);z-index:2}.typebox{position:relative;z-index:4;width:min(86vw,390px);min-height:190px;display:flex;align-items:center;justify-content:center;padding:24px;border-radius:26px;background:rgba(247,232,235,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 15px 50px rgba(75,49,56,.08)}#typed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(17px,4.8vw,21px);line-height:1.62;font-weight:550;text-align:left;margin:0}.cursor{display:inline-block;width:2px;height:1em;background:var(--text);vertical-align:-2px;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}#heartScene{pointer-events:none;position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:transparent}#heartScene.show{display:flex}.big-heart{font-size:64px;opacity:0;animation:heartTakeover 5.2s cubic-bezier(.2,.7,.25,1) forwards;filter:drop-shadow(0 12px 35px rgba(201,133,150,.35))}@keyframes heartTakeover{0%{opacity:0;transform:scale(.25)}15%{opacity:1;transform:scale(.8)}72%{opacity:1;transform:scale(13)}100%{opacity:0;transform:scale(17)}}@media(prefers-reduced-motion:reduce){.fh{display:none}.photo{animation-duration:20s}}
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>
<section class="screen active" id="intro"><div class="content"><h1>Dünyayı hassas kalpler için cehenneme çevirenlere inat cenneti yaşamaya var mısın sevgilim?</h1><button class="love" onclick="go('question')">Aşka 🤍</button></div></section>
<section class="screen" id="question"><div class="content"><h2>Değerli bir kalbe güzelliğini hatırlatma vakti gelmedi mi sence?</h2><div class="answers"><button class="yes" onclick="startMemory()">Evet 🤍</button><button class="no" id="noBtn">Hayır</button></div></div></section>
<section class="screen" id="memory">
  <img class="photo" src="2288677b-8bde-44b1-8277-3eefd14b0466.JPG" alt="Bir anımız">
  <img class="photo" src="57cca70a-6719-42df-97b9-c90564348a71.JPG" alt="Bir anımız">
  <img class="photo" src="9b09e052-b9c6-456e-9559-f22aad1a69a7.JPG" alt="Bir anımız">
  <img class="photo" src="IMG_1004.HEIC" alt="Bir anımız">
  <img class="photo" src="IMG_1455.heic" alt="Bir anımız">
  <div class="memory-shade"></div><div class="typebox"><p id="typed"></p><span class="cursor" id="cursor"></span></div>
</section>
<div id="heartScene"><div class="big-heart">💗</div></div>
<script>
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
const floaters=document.getElementById('floaters');for(let i=0;i<8;i++){const h=document.createElement('span');h.className='fh';h.textContent=i%2?'♡':'♥';h.style.left=(5+Math.random()*90)+'%';h.style.fontSize=(13+Math.random()*17)+'px';h.style.animationDuration=(12+Math.random()*8)+'s';h.style.animationDelay=(-Math.random()*15)+'s';h.style.setProperty('--d',(-35+Math.random()*70)+'px');floaters.appendChild(h)}
const no=document.getElementById('noBtn');let escapes=0;function escapeNo(e){if(e)e.preventDefault();no.classList.add('running');const pad=18,w=120,h=54;const x=pad+Math.random()*Math.max(1,innerWidth-w-pad*2);const y=pad+Math.random()*Math.max(1,innerHeight-h-pad*2);no.style.left=x+'px';no.style.top=y+'px';escapes++;no.textContent=escapes>3?'Olmaz 😌':escapes>1?'Emin misin? 🙃':'Hayır'}['pointerenter','pointerdown','touchstart'].forEach(ev=>no.addEventListener(ev,escapeNo,{passive:false}));
const text='Bir meleğin gözyaşlarını hak etmediğini hatırlamak istersen aynaya bak sevgilim. Gözyaşlarını silmek için orada olacağım.';let typingStarted=false;function startMemory(){go('memory');floaters.style.opacity='.35';if(typingStarted)return;typingStarted=true;const out=document.getElementById('typed');let i=0;setTimeout(()=>{const t=setInterval(()=>{out.textContent+=text.charAt(i++);if(i>=text.length){clearInterval(t);document.getElementById('cursor').style.display='none';setTimeout(showHeart,1800)}},58)},900)}function showHeart(){const hs=document.getElementById('heartScene');hs.classList.add('show');setTimeout(()=>{hs.classList.remove('show')},5400)}
</script>
</body>
</html>
