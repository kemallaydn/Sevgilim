<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ead2d7"><title>Cananım 🤍</title>
<style>
:root{--bg:#ead2d7;--card:#f7e8eb;--text:#4b3138;--pink:#c98596}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit;border:0;cursor:pointer}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px 24px calc(30px + env(safe-area-inset-bottom));text-align:center}.screen.active{display:flex;animation:fade .65s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.content{width:min(100%,430px);position:relative;z-index:5}h1,h2{margin:0 auto;letter-spacing:-.025em;font-weight:650}h1{font-size:clamp(27px,7.4vw,36px);line-height:1.22}h2{font-size:clamp(24px,6.7vw,32px);line-height:1.28}.love{margin-top:32px;padding:15px 30px;border-radius:999px;background:var(--text);color:#fff8fa;font-weight:700;font-size:16px}.answers{display:flex;gap:12px;justify-content:center;margin-top:34px;min-height:54px}.yes,.no{width:132px;padding:15px;border-radius:999px;font-weight:700;font-size:16px}.yes{background:var(--text);color:white}.no{background:rgba(255,255,255,.45);color:var(--text);border:1px solid rgba(75,49,56,.08)}.no.running{position:fixed;z-index:30;width:120px;transition:left .16s ease,top .16s ease}.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}.fh{position:absolute;bottom:-40px;color:rgba(201,133,150,.28);animation:up linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-115vh) translateX(var(--d));opacity:0}}
#memory{padding:0;background:#e6ccd2;overflow:hidden}.gallery{position:absolute;inset:0;z-index:1;overflow:hidden}.photo{position:absolute;width:clamp(145px,18vw,260px);height:clamp(190px,27vw,350px);object-fit:cover;object-position:center;border-radius:22px;padding:5px;background:#fff8fa;box-shadow:0 16px 45px rgba(75,49,56,.18);opacity:.88;animation:wander var(--speed) ease-in-out infinite alternate;transform:rotate(var(--r))}.p1{left:2%;top:3%;--r:-7deg;--speed:9s}.p2{left:22%;top:54%;--r:5deg;--speed:11s}.p3{right:2%;top:5%;--r:7deg;--speed:10s}.p4{right:20%;bottom:3%;--r:-5deg;--speed:12s}.p5{left:43%;top:-7%;--r:3deg;--speed:10.5s}.clone1{left:-3%;bottom:-8%;--r:6deg;--speed:13s}.clone2{right:-4%;top:42%;--r:-8deg;--speed:11.5s}.clone3{left:31%;top:8%;--r:-3deg;--speed:12.5s}.clone4{right:34%;bottom:-13%;--r:5deg;--speed:9.5s}.clone5{left:7%;top:39%;--r:-4deg;--speed:14s}@keyframes wander{from{translate:-12px 12px}to{translate:18px -18px}}.memory-shade{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(234,210,215,.88) 0,rgba(234,210,215,.66) 25%,rgba(234,210,215,.2) 55%,rgba(234,210,215,.05) 100%);z-index:2;pointer-events:none}.typebox{position:relative;z-index:4;width:min(84vw,410px);min-height:190px;display:flex;align-items:center;justify-content:center;padding:25px;border-radius:26px;background:rgba(247,232,235,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 15px 50px rgba(75,49,56,.12);transition:opacity .8s ease}#typed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(16px,4.5vw,20px);line-height:1.62;font-weight:550;text-align:left;margin:0}.cursor{display:inline-block;width:2px;height:1em;background:var(--text);animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}#heartScene{pointer-events:none;position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center}#heartScene.show{display:flex}.big-heart{font-size:64px;opacity:0;animation:heartTakeover 5.2s cubic-bezier(.2,.7,.25,1) forwards}@keyframes heartTakeover{0%{opacity:0;transform:scale(.25)}15%{opacity:1;transform:scale(.8)}72%{opacity:1;transform:scale(13)}100%{opacity:0;transform:scale(17)}}#ytMusic{position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;opacity:.001;pointer-events:none}
#story{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;pointer-events:none}.story-card{position:absolute;width:min(78vw,340px);aspect-ratio:3/4;border-radius:26px;overflow:hidden;box-shadow:0 22px 60px rgba(75,49,56,.28);opacity:0;transform-origin:center center;will-change:transform,opacity}.story-card img{width:100%;height:100%;object-fit:cover;display:block}.story-overlay{position:absolute;inset:auto 0 0 0;padding:48px 20px 22px;background:linear-gradient(transparent,rgba(35,20,24,.76));color:white;font-size:clamp(18px,5.2vw,24px);line-height:1.25;font-weight:700;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.28);opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease}.story-card.focus .story-overlay{opacity:1;transform:translateY(0)}
#storyFinal{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;padding:18px;pointer-events:none;background:rgba(230,204,210,.2)}.final-collage{position:relative;width:min(92vw,860px);height:min(70vh,560px);display:flex;align-items:center;justify-content:center}.final-photo{position:absolute;width:min(30vw,260px);aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:5px solid #fff8fa;box-shadow:0 18px 55px rgba(75,49,56,.24)}.final-photo:nth-child(1){transform:translateX(-72%) rotate(-7deg);z-index:1}.final-photo:nth-child(2){transform:translateY(-2%) rotate(1deg);z-index:2}.final-photo:nth-child(3){transform:translateX(72%) rotate(7deg);z-index:1}.final-message{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,560px);min-height:96px;padding:18px 22px;color:#fffafc;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(20px,3.8vw,34px);line-height:1.28;font-weight:700;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}.final-cursor{display:inline-block;width:2px;height:1em;margin-left:4px;background:#fffafc;vertical-align:-.12em;animation:blink .7s steps(1) infinite}
@media(max-width:600px){.photo{width:34vw;height:45vw;border-radius:17px}.p1{left:-9%;top:2%}.p2{left:-8%;top:58%}.p3{right:-8%;top:4%}.p4{right:-9%;bottom:0}.p5{left:33%;top:-15%}.clone1{left:25%;bottom:-20%}.clone2{right:-13%;top:39%}.clone3{left:-14%;top:31%}.clone4{right:26%;bottom:-18%}.clone5{left:35%;top:64%}.memory-shade{background:radial-gradient(circle at center,rgba(234,210,215,.92) 0,rgba(234,210,215,.72) 28%,rgba(234,210,215,.12) 67%)}.story-card{width:min(76vw,320px)}#storyFinal{padding:10px}.final-collage{width:100vw;height:72vh}.final-photo{width:39vw;border-width:4px;border-radius:16px}.final-photo:nth-child(1){transform:translate(-48%,-6%) rotate(-8deg)}.final-photo:nth-child(2){transform:translateY(10%) rotate(1deg)}.final-photo:nth-child(3){transform:translate(48%,-6%) rotate(8deg)}.final-message{width:86vw;min-height:90px;padding:15px 16px;font-size:clamp(17px,5.2vw,23px);line-height:1.3}}
</style></head><body>
<div id="ytMusic" aria-hidden="true"></div><div class="floaters" id="floaters"></div>
<section class="screen active" id="intro"><div class="content"><h1>Dünyayı hassas kalpler için cehenneme çevirenlere inat cenneti yaşamaya var mısın sevgilim?</h1><button class="love" onclick="enterLove()">Let’s Go 🤍</button></div></section>
<section class="screen" id="question"><div class="content"><h2>Değerli bir kalbe güzelliğini hatırlatma vakti gelmedi mi sence?</h2><div class="answers"><button class="yes" onclick="startMemory()">Evet 🤍</button><button class="no" id="noBtn">Hayır</button></div></div></section>
<section class="screen" id="memory"><div class="gallery">
<img class="photo p1" src="2288677b-8bde-44b1-8277-3eefd14b0466.JPG"><img class="photo p2" src="57cca70a-6719-42df-97b9-c90564348a71.JPG"><img class="photo p3" src="9b09e052-b9c6-456e-9559-f22aad1a69a7.JPG"><img class="photo p4" src="IMG_1004.jpg"><img class="photo p5" src="IMG_1455.jpg"><img class="photo clone1" src="2288677b-8bde-44b1-8277-3eefd14b0466.JPG"><img class="photo clone2" src="57cca70a-6719-42df-97b9-c90564348a71.JPG"><img class="photo clone3" src="9b09e052-b9c6-456e-9559-f22aad1a69a7.JPG"><img class="photo clone4" src="IMG_1004.jpg"><img class="photo clone5" src="IMG_1455.jpg"></div><div class="memory-shade"></div><div class="typebox"><p id="typed"></p><span class="cursor" id="cursor"></span></div></section>
<div id="heartScene"><div class="big-heart">💗</div></div>
<div id="story">
<div class="story-card" id="story1"><img src="2288677b-8bde-44b1-8277-3eefd14b0466.JPG"><div class="story-overlay">Masmavi denizlere güneş gibi yansıyan ışığın</div></div>
<div class="story-card" id="story2"><img src="57cca70a-6719-42df-97b9-c90564348a71.JPG"><div class="story-overlay">Gülüşlerinde hayat bulmasını sağlayan</div></div>
<div class="story-card" id="story3"><img src="9b09e052-b9c6-456e-9559-f22aad1a69a7.JPG"><div class="story-overlay">Melek yüzlü kadınım, yüzündeki o gülüş hiç solmasın</div></div>
</div>
<div id="storyFinal"><div class="final-collage"><img class="final-photo" src="2288677b-8bde-44b1-8277-3eefd14b0466.JPG"><img class="final-photo" src="57cca70a-6719-42df-97b9-c90564348a71.JPG"><img class="final-photo" src="9b09e052-b9c6-456e-9559-f22aad1a69a7.JPG"><div class="final-message"><span id="finalTyped"></span><span class="final-cursor" id="finalCursor"></span></div></div></div>
<script src="https://www.youtube.com/iframe_api"></script><script>
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
const floaters=document.getElementById('floaters');for(let i=0;i<8;i++){const h=document.createElement('span');h.className='fh';h.textContent=i%2?'♡':'♥';h.style.left=(5+Math.random()*90)+'%';h.style.fontSize=(13+Math.random()*17)+'px';h.style.animationDuration=(12+Math.random()*8)+'s';h.style.animationDelay=(-Math.random()*15)+'s';h.style.setProperty('--d',(-35+Math.random()*70)+'px');floaters.appendChild(h)}
let player,musicWanted=false;function onYouTubeIframeAPIReady(){player=new YT.Player('ytMusic',{height:'1',width:'1',videoId:'2Vv-BfVoq4g',playerVars:{playsinline:1,controls:0,loop:1,playlist:'2Vv-BfVoq4g'},events:{onReady:()=>{if(musicWanted)playMusic()}}})}function playMusic(){musicWanted=true;if(player&&player.playVideo){player.setVolume(35);player.playVideo()}}function enterLove(){playMusic();go('question')}
const no=document.getElementById('noBtn');let escapes=0;function escapeNo(e){if(e)e.preventDefault();no.classList.add('running');const pad=18,w=120,h=54;no.style.left=(pad+Math.random()*Math.max(1,innerWidth-w-pad*2))+'px';no.style.top=(pad+Math.random()*Math.max(1,innerHeight-h-pad*2))+'px';escapes++;no.textContent=escapes>3?'Olmaz 😌':escapes>1?'Emin misin? 🙃':'Hayır'}['pointerenter','pointerdown','touchstart'].forEach(ev=>no.addEventListener(ev,escapeNo,{passive:false}));
const text='Bir meleğin gözyaşlarını hak etmediğini hatırlamak istersen aynaya bak sevgilim. Gözyaşlarını silmek için orada olacağım.';let typingStarted=false;function startMemory(){playMusic();go('memory');floaters.style.opacity='.3';if(typingStarted)return;typingStarted=true;const out=document.getElementById('typed');let i=0;setTimeout(()=>{const t=setInterval(()=>{out.textContent+=text.charAt(i++);if(i>=text.length){clearInterval(t);document.getElementById('cursor').style.display='none';setTimeout(showHeart,1800)}},58)},900)}function showHeart(){const hs=document.getElementById('heartScene');hs.classList.add('show');setTimeout(()=>{hs.classList.remove('show');startStory()},5400)}
function flyCard(card,source,entering){const sr=source.getBoundingClientRect();const cr=card.getBoundingClientRect();const dx=(sr.left+sr.width/2)-(cr.left+cr.width/2);const dy=(sr.top+sr.height/2)-(cr.top+cr.height/2);const scale=Math.max(.18,Math.min(.82,sr.width/cr.width));const rot=getComputedStyle(source).getPropertyValue('--r').trim()||'0deg';const from={opacity:.82,transform:`translate(${dx}px,${dy}px) scale(${scale}) rotate(${rot})`};const center={opacity:1,transform:'translate(0,0) scale(1) rotate(0deg)'};return card.animate(entering?[from,center]:[center,from],{duration:1100,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})}
const finalText="Yüzündeki gülümsemeyi eksik etmemeye yemin etmiş F.A.'dan Sevgilerle 🤍";let finalTypingStarted=false;function typeFinalMessage(){if(finalTypingStarted)return;finalTypingStarted=true;const out=document.getElementById('finalTyped');const cursor=document.getElementById('finalCursor');let i=0;const timer=setInterval(()=>{out.textContent+=finalText.charAt(i++);if(i>=finalText.length){clearInterval(timer);setTimeout(()=>cursor.style.display='none',900)}},62)}
function startStory(){document.querySelector('.typebox').style.opacity='0';document.querySelector('.memory-shade').style.background='rgba(234,210,215,.14)';const story=document.getElementById('story');story.style.display='flex';const cards=[document.getElementById('story1'),document.getElementById('story2'),document.getElementById('story3')];const sources=[document.querySelector('.p1'),document.querySelector('.p2'),document.querySelector('.p3')];let idx=0;function showNext(){if(idx>=cards.length){story.style.display='none';const final=document.getElementById('storyFinal');final.style.display='flex';setTimeout(typeFinalMessage,1500);return}const card=cards[idx],source=sources[idx];card.style.opacity='1';flyCard(card,source,true);setTimeout(()=>card.classList.add('focus'),620);setTimeout(()=>{card.classList.remove('focus');const out=flyCard(card,source,false);out.onfinish=()=>{card.style.opacity='0';idx++;setTimeout(showNext,180)}},3100)}setTimeout(showNext,650)}
</script></body></html>
